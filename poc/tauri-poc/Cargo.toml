[package]
name = "tauri-poc"
version = "0.1.0"
description = "FuFumidi Tauri 2 feasibility POC (isolated prototype)"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# POC 专用：release 档只用于产物体积测量，不追求最优
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
