[package]
name = "fufumidi-shell"
version = "6.5.0-alpha.4"
description = "FuFumidi Tauri shell (Rust host; Python only for model inference)"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
fufumidi-core = { version = "0.3.0", path = "../../crates/fufumidi-core" }
zip = "4.2.0"
sha2 = "0.10.9"
sha1 = "0.10.7"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
