[package]
name = "fufumidi"
version = "3.1.8"
description = "FuFumidi - offline MIDI workstation (Tauri)"
authors = ["FuFumidi"]
license = "MIT"
edition = "2021"

[lib]
name = "fufumidi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
