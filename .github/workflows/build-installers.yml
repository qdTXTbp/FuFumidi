name: Build Installers (manual, Linux & macOS)

# 手动触发的跨平台安装包构建。原触发条件是 tags: ['v2.0.0*']，早已失效（见 docs/HYGIENE.md）。
# 当前发布通道只上传 Windows 安装包（release/FuFumidi-Setup-*.exe），
# 这个工作流保留为「想要 Linux/macOS 产物时手动跑」的路径。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r engine/requirements-bundle.txt

      - name: Prepare bundled Python resources
        run: |
          mkdir -p ci-resources/python ci-resources/models
          cp -a "$(python -c "import sys; print(sys.prefix)")/." ci-resources/python/
          # basic-pitch model
          curl -L -o ci-resources/models/basic_pitch_quant.onnx "https://github.com/spotify/basic-pitch/releases/download/v0.3.0/basic_pitch_quant.onnx" || true
          # piano model
          curl -L -o ci-resources/models/piano_transcription_model.pth "https://zenodo.org/record/4034264/files/CRNN_note_F1%3D0.9677_pedal_F1%3D0.9186.pth?download=1" || true

      - name: Build installer
        run: |
          npx --yes electron-builder --config electron-builder.ci.yml --publish never --${{ matrix.os == 'ubuntu-latest' && 'linux' || 'mac' }} --x64

      - name: Upload installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fufumidi-${{ matrix.os }}-installer
          path: |
            release-ci/**/*.AppImage
            release-ci/**/*.deb
            release-ci/**/*.dmg
