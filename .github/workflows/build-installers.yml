name: Build Installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v2.0.0*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r engine/requirements.txt

      - name: Prepare bundled Python resources
        run: |
          mkdir -p ci-resources/python ci-resources/models
          cp -a "$(python -c "import sys; print(sys.prefix)")/." ci-resources/python/
          # basic-pitch model
          curl -L -o ci-resources/models/basic_pitch_quant.onnx "https://github.com/spotify/basic-pitch/releases/download/v0.3.0/basic_pitch_quant.onnx" || true
          # piano model
          curl -L -o ci-resources/models/piano_transcription_model.pth "https://zenodo.org/record/4034264/files/CRNN_note_F1%3D0.9677_pedal_F1%3D0.9186.pth?download=1" || true

      - name: Build installer
        run: |
          npx --yes electron-builder --config electron-builder.ci.yml --${{ matrix.os == 'ubuntu-latest' && 'linux' || 'mac' }} --x64

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: fufumidi-${{ matrix.os }}-installer
          path: |
            release-ci/**/*.AppImage
            release-ci/**/*.deb
            release-ci/**/*.dmg