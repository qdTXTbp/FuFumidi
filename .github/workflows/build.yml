name: Build & Verify (manual)

# 手动触发的工作流：在三个平台上装好依赖、跑通引擎探针、把 app.asar 打出来。
#
# 原触发条件写作 tags: ['v2.0.0*'] —— 版本号走到 5.x 之后这个过滤器永远匹配不上，
# 工作流自 v2.0.0 起就没再运行过。要么把它接到 v*，要么承认它只是手动验证路径；
# 这里选后者，因为它依赖的三个 runner 都无法从本机验证（见 docs/HYGIENE.md 的 CI 一节）。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r engine/requirements-bundle.txt

      - name: Dependency check (universal / piano / separate)
        run: python engine/deps.py check

      - name: Engine probe
        run: python -c "import sys; sys.path.insert(0,'engine'); import engine_basic; print('probe ok')"

      - name: Pack asar
        run: npx --yes @electron/asar pack . app.asar --unpack-dir=engine --unpack='*.node'

      - name: Upload asar artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fufumidi-${{ matrix.os }}-asar
          path: app.asar
