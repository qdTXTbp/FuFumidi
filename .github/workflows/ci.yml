name: CI

# 本仓库的守门工作流：只在 master/main 上跑，Windows runner。
#
# 说明：原文件里还有一个 package job（if: push && refs/tags/v），但它**永远不会执行** ——
# 上面 on.push 只列了分支，tag 推送根本不会触发本工作流（实测 v5.0.0-beta.1 / beta.2
# 两个 tag 在 GitHub 上都是 0 次运行）。发布用的 Windows 安装包在本机构建，
# 因为 electron-builder.yml 的 extraResources 需要仓库外的 resources/（python / models / g2p），
# 见 README 的「构建」一节。这个死 job 已删除，见 docs/HYGIENE.md。

on:
  pull_request:
    branches:
      - master
      - main
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Python syntax check
        run: |
          python -m py_compile engine/*.py
          python -c "import sys; sys.path.insert(0,'engine'); import presets; print('presets ok')"

      - name: Run UI tests
        run: npm run test:ui

      - name: Run plugin sandbox tests
        run: npm run test:plugin

      - name: Empty catch gate
        run: npm run check:empty-catch

      - name: Pack full asar
        run: node build.js full

      - name: Verify asar contents
        run: npx --yes @electron/asar list dist/fufumidi-full.asar | findstr /C:"main.js" /C:"engine\music2midi.py" /C:"frontend\src\views\ViewResources.vue"

  pytest:
    # 6.4：引擎测试已在本机全量跑通（含 ref 缺失时自动 skip），作为 required 门禁。
    # 6.7.1：改为 requirements-ci.txt（原先直接装 requirements-bundle.txt，在 python 3.12 上
    #   因 basic-pitch 声明 tensorflow<2.15.1（无 cp312 wheel）**解析即失败**，这个 job 从建起就没绿过）。
    runs-on: windows-latest
    env:
      # 应用启动引擎时一直带着这两个变量（main/diffsinger.js / models.js / omr.js），
      # 但测试里是直接 spawn python，不设的话 runner 的 stdout 是 cp1252，
      # 引擎打印中文 ###RESULT 会抛 UnicodeEncodeError（本机 cp936 侥幸不报）。
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: engine/requirements-ci.txt
      - name: Install engine test dependencies
        run: |
          python -m pip install --upgrade pip
          # basic-pitch 的依赖里钉了 tensorflow<2.15.1，而 TF 没有 cp312 的 wheel。
          # 应用本身走 ONNX 后端、出厂运行时也不带 TF（scripts/bundle-python.js 的 TF_STACK），
          # 所以这里同样 --no-deps 后手工补齐它真正需要的推理链（见 requirements-ci.txt）。
          python -m pip install --no-deps "basic-pitch>=0.4.0"
          python -m pip install -r engine/requirements-ci.txt
      - name: Run pytest suite
        # 测试按「在 engine 目录下运行」编写（import audio_io 靠 CWD 进 sys.path），
        # 在仓库根跑会整片 ModuleNotFoundError。
        working-directory: engine
        run: python -m pytest tests -q --basetemp="$env:RUNNER_TEMP\pytest"
