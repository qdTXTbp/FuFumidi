name: CI

# 本仓库的守门工作流：只在 master/main 上跑，Windows runner。
#
# 说明：原文件里还有一个 package job（if: push && refs/tags/v），但它**永远不会执行** ——
# 上面 on.push 只列了分支，tag 推送根本不会触发本工作流（实测 v5.0.0-beta.1 / beta.2
# 两个 tag 在 GitHub 上都是 0 次运行）。发布用的 Windows 安装包在本机构建，
# 因为 electron-builder.yml 的 extraResources 需要仓库外的 resources/（python / models / g2p），
# 见 README 的「构建」一节。这个死 job 已删除，见 docs/HYGIENE.md。

on:
  pull_request:
    branches:
      - master
      - main
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Python syntax check
        run: |
          python -m py_compile engine/*.py
          python -c "import sys; sys.path.insert(0,'engine'); import presets; print('presets ok')"

      - name: Run UI tests
        run: npm run test:ui

      - name: Run plugin sandbox tests
        run: npm run test:plugin

      - name: Empty catch gate
        run: npm run check:empty-catch

      - name: IPC contract drift gate
        run: npm run check:contracts

      - name: Brand asset gate (logo must not change)
        run: npm run check:brand

      - name: M0 unit tests (probe cache / db persist / storage cache)
        run: node --test scripts/test-engine-probe-cache.mjs scripts/test-db-persist.mjs scripts/test-storage-cache.mjs

      - name: Pack full asar
        run: node build.js full

      - name: Verify asar contents
        run: npx --yes @electron/asar list dist/fufumidi-full.asar | findstr /C:"main.js" /C:"engine\music2midi.py" /C:"frontend\src\views\ViewResources.vue"

  rust-core:
    # 运行时轨道 M0/M1：crates/ workspace 是新的 Rust 内核（SMF 解析/统计/量化/移调 + JSON 协议）。
    # 与老 rust-core/ 并存；这里只跑新 workspace，并用 JS↔Rust 双跑对拍守住解析一致性。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Rust fmt check
        run: cargo fmt --manifest-path crates/Cargo.toml --all -- --check
      - name: Rust clippy (deny warnings)
        run: cargo clippy --manifest-path crates/Cargo.toml --all-targets -- -D warnings
      - name: Rust tests (crates workspace)
        run: cargo test --manifest-path crates/Cargo.toml
      - name: Build Rust engine (release)
        run: cargo build --manifest-path crates/Cargo.toml --release
      - name: MIDI dual-run (JS vs Rust)
        run: node scripts/dualrun/compare-midi.mjs --gen --rust-bin crates/target/release/fufumidi-engine.exe
      - name: Rust bridge tests (main/rust.js ↔ new engine)
        env:
          FUFUMIDI_RUST_BIN: crates\target\release\fufumidi-engine.exe
        run: node --test scripts/test-rust-bridge.mjs

  pytest:
    # 6.4：引擎测试已在本机全量跑通（含 ref 缺失时自动 skip），作为 required 门禁。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install engine test dependencies
        run: python -m pip install -r engine/requirements-bundle.txt
      - name: Run pytest suite
        run: python -m pytest engine/tests -q --basetemp="$env:RUNNER_TEMP\pytest"
