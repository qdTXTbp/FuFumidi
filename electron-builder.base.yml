appId: com.fufumidi.app
electronVersion: 33.4.11
productName: FuFumidi
directories:
  output: release-base
asarUnpack:
  - "engine/**"
  - "**/*.node"
  - "renderer/dist/wallpapers/**"
files:
  - "**/*"
  - "!dist/**"
  - "!release/**"
  - "!release-base/**"
  - "!.git/**"
  - "!build.js"
  - "!electron-builder.yml"
  - "!electron-builder.base.yml"
# 打包附带的外部大体积资源（Python 运行时、模型、提权工具）。
# 这些文件不在 git 仓库中，构建前需按 README 准备到 resources/ 目录（相对本仓库根）。
extraResources:
  - from: "resources/python"
    to: python
    filter:
      - "**/*"
      - "!**/torch/**"
      - "!**/demucs/**"
      - "!**/piano_transcription_inference/**"
      - "!**/torchvision/**"
      - "!**/torchaudio/**"
      - "!**/Scripts/torchrun.exe"
      - "!**/Scripts/demucs.exe"
      - "!**/Scripts/f2py.exe"
      - "!**/Scripts/torchfrtrace.exe"
  - from: "resources/models"
    to: models
    filter:
      - "basic_pitch_quant.onnx"
  - from: "resources/elevate.exe"
    to: elevate.exe
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: FuFumidi
