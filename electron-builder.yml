appId: com.fufumidi.app
electronVersion: 33.4.11
productName: FuFumidi
npmRebuild: false
directories:
  output: release
asarUnpack:
  - "engine/**"
  - "**/*.node"
  - "renderer/dist/wallpapers/**"
  - "renderer/vendor/soundfonts/**"
  - "renderer/dist/vendor/js-synth/**"
files:
  - "**/*"
  - "!dist/**"
  - "!.git/**"
  # 打包输出目录必须整体排除：默认 output 为 release/，但本地测试常用
  # release-test/ 等自定义 output（如 -c.directories.output=release-test），
  # 若只排除 release/** 会把上一次的完整产物（含 python/models，数 GB）
  # 当源码重新打回 app.asar，实测让 asar 从 ~200MB 膨胀到 2GB+。
  - "!release/**"
  - "!release-*/**"
  - "!*-unpacked/**"
  # GPU 增强包的构建中间产物：gpu-package/（cuda/directml staging）、
  # gpu-package-rocm/（4.5GB / 1.8 万文件）、gpu-package-out/（分卷输出 6.8GB）。
  # 它们不在 release* 命名下，只靠上面三条排不掉 —— 实测误打进 asar 会让它
  # 从 ~70MB 膨胀到 **15GB**（36086 条目，其中 3.6 万来自这几个目录）。
  - "!gpu-package*/**"
  - "!build.js"
  - "!electron-builder.yml"
  # --- 3.2.6 全面自查：开发残留不入包（运行时零引用，已逐一核实） ---
  - "!electron-builder.base.yml"
  - "!electron-builder.ci.yml"
  - "!build-gpu-package.js"
  - "!frontend/**"          # Vue 源码：运行时只用 renderer/dist 构建产物
  - "!docs/**"              # README 配图
  - "!scripts/**"           # 构建/上传脚本
  - "!tools/**"             # kachina-builder.exe 等构建工具
  # 编辑器/AI 工具的项目数据目录：工作日志、临时脚本、编辑器配置。
  # 属开发机内部数据（且不是运行时依赖），打进包会把工作日志随安装包分发出去。
  - "!.workbuddy/**"
  - "!.trae/**"
  # 服务端 Cloudflare Worker 源码（cloud-sync/worker/）：它是独立部署的组件，不是应用代码。
  # 排除它是为了让安装版与发布版一致 —— scripts/deploy-installed.cjs 的过滤清单直接读本文件。
  - "!cloud-sync/**"
  - "!test/**"
  # 开发用文件（用户不需要；LICENSE 除外 —— MIT 要求随二进制分发版权声明）
  - "!AGENTS.md"
  - "!SECURITY.md"
  - "!.editorconfig"
  - "!.gitattributes"
  - "!.gitignore"
  - "!package-lock.json"
  # sql.js 只用到 dist/sql-wasm.js（包 main）+ sql-wasm.wasm（main/db.js:38 locateFile）。
  # 其余 16 个文件是 asm/browser/debug/zip 变体，实测 23.4MB，一个都加载不到：
  #   dist 里 18 个文件、仅 2 个可达 —— 逐个排除比「排除整个目录再放行两个」安全，
  #   不依赖 files 列表里「排除与放行谁赢」的规则。
  - "!node_modules/sql.js/dist/sql-asm*"
  - "!node_modules/sql.js/dist/worker.sql-*"
  - "!node_modules/sql.js/dist/sql-wasm-browser*"
  - "!node_modules/sql.js/dist/sql-wasm-debug*"
  - "!node_modules/sql.js/dist/sqljs-*.zip"
  - "!rust-core/**"         # Rust 源码（编译产物经 extraResources 分发到 resources/rust-core）
  - "!.github/**"
  - "!README.md"
  - "!README-CN.md"
  - "!CHANGES.md"
  - "!UPDATING.md"
  - "!engine/tests/**"      # pytest 开发测试
  - "!**/__pycache__/**"
  - "!**/*.pyc"
  - "!**/.pytest_cache/**"  # 必须带 **/ 前缀：pytest 缓存实际在 engine/ 下，写成 !.pytest_cache/** 只匹配根目录，等于没排
  # 开发模式的数据根目录。发布版的数据根目录就是「安装目录旁的 FuFumidiData」，
  # 打进包会被原样铺到用户机器上 —— 实测带进去了开发机曲库里的 MIDI、
  # basic_pitch 权重与 matplotlib 缓存，等于把本机私有曲目随安装包分发出去。
  - "!FuFumidiData/**"
  # resources/** 与 models/** 由 extraResources 单独分发到 win-unpacked/resources，
  # 若再打进 app.asar 会重复打包（python 1.3GB / models 160MB），导致体积翻倍
  - "!resources/**"
  - "!models/**"
  # Tauri 迁移目录与编译产物不进入 Electron 包（否则 src-tauri/target 会让 asar 膨胀到 5GB+）
  - "!src-tauri/**"
  - "!frontend/src/bridge/**"
  # soundfonts 下载/暂存目录不入包（开发产物，避免膨胀与未定稿资源进发布版）
  - "!soundfonts-dist/**"
  - "!.sfdist-tmp/**"
# 应用内 i18n 覆盖中文/英文/日文：裁掉其余 ~34MB 的 Chromium 语言包（缺失语言回退 en-US）
electronLanguages:
  - en-US
  - zh-CN
  - zh-TW
  - ja
extraResources:
  - from: "resources/python"
    to: python
  # VC++ 2015-2022 x64 运行库：干净 Windows 不自带，缺了 torch/onnxruntime 直接
  # 加载失败。这里另存一份（不在更新器 ignoreFolderPath 里，更新会带上），
  # 由 main.js 的 ensureRuntimeDlls 在首次用到引擎时补进 resources/python。
  - from: "resources/vcredist"
    to: vcredist
  - from: "resources/models"
    to: models
  # G2p 神经网络模型（13 个 g2p-*.zip，共 25MB）：歌词 → 音素的多音字消歧。
  # 来自 OpenUtau.Core/G2p/Data/（上游是 .NET 内嵌资源，我们是磁盘文件）。
  # 路径由 engine/singing/openutau/g2p/models.py 解析：它按
  # 「sys.executable 同级的 g2p/」找 —— 打包后正是 <app>/resources/g2p/。
  - from: "resources/g2p"
    to: g2p
  # 可选 Rust 核心（scripts/build-rust.ps1 产物）：缺失时 main/rust.js 自动降级为纯 JS 路径
  - from: "resources/rust-core"
    to: rust-core
  - from: "resources/elevate.exe"
    to: elevate.exe
  - from: "build/icon.png"
    to: icon.png
# kachina 增量更新器需与主程序 exe 同级（launchUpdater 在 process.execPath 目录查找）
extraFiles:
  - from: "release/update/FuFumidi.update.exe"
    to: "FuFumidi.update.exe"
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: FuFumidi
  # 安装前清理历史作用域（HKCU/HKLM/WOW6432Node）的残留卸载项，
  # 根治「有之前没清理的目录/覆盖重装」反复提示；
  # 卸载时询问是否保留 FuFumidiData（模型/声库/曲库），见 build/nsis-custom.nsh
  include: build/nsis-custom.nsh
