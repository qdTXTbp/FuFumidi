appId: com.fufumidi.app
electronVersion: 33.4.11
productName: FuFumidi
directories:
  output: release
asarUnpack:
  - "engine/**"
  - "**/*.node"
  - "renderer/dist/wallpapers/**"
  - "renderer/vendor/soundfonts/**"
files:
  - "**/*"
  - "!dist/**"
  - "!.git/**"
  - "!release/**"
  - "!build.js"
  - "!electron-builder.yml"
extraResources:
  - from: "resources/python"
    to: python
  - from: "resources/models"
    to: models
  - from: "resources/elevate.exe"
    to: elevate.exe
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: FuFumidi
