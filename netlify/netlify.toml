# Netlify 站点配置
#
# ★ Netlify UI 里要把 Base directory 设成 netlify —— 站点根就是这个目录。
#   这样构建时只 npm install 这里的依赖（@netlify/blobs），不会去装 Electron 那一大坨。
#
# 为什么是 Netlify：*.workers.dev 在国内被 SNI 阻断、Deno Deploy 已随 Cloudflare 收购停服；
# *.netlify.app 实测可达（404 / 0.49 秒，无 SNI 阻断）。详见 docs/plans/2026-10-16-feedback-upload.md。

[build]
  publish = "public"

[functions]
  directory = "functions"
  node_bundler = "esbuild"
