<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:#080d18;overflow:hidden;font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:#eaf3ff}
.stage{position:relative;width:100%;height:100%;display:flex;align-items:center;gap:26px;padding:0 34px;background:
 radial-gradient(100% 150% at 8% 0%,rgba(44,94,180,.52),transparent 58%),
 radial-gradient(90% 120% at 100% 100%,rgba(112,74,200,.26),transparent 60%),
 linear-gradient(135deg,#101c33,#070b14 62%,#0b1020)}
.stage:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(120,170,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(120,170,255,.055) 1px,transparent 1px);background-size:34px 34px;mask-image:radial-gradient(90% 130% at 30% 40%,#000 20%,transparent 75%)}
.glow{position:absolute;width:260px;height:260px;left:-70px;top:-90px;border-radius:50%;background:radial-gradient(circle,rgba(70,155,255,.28),transparent 65%);filter:blur(14px);animation:drift 5s ease-in-out infinite}
.mark{position:relative;width:112px;height:112px;flex:none;display:grid;place-items:center}
.ring{position:absolute;inset:0;border-radius:34px;border:1px solid rgba(140,205,255,.42);box-shadow:0 0 34px rgba(65,150,255,.25),inset 0 0 26px rgba(80,160,255,.12);animation:breathe 2.8s ease-in-out infinite}
.ring:before{content:"";position:absolute;inset:7px;border-radius:28px;border:1px solid rgba(130,195,255,.20)}
.mark img{width:86px;height:86px;object-fit:contain;filter:drop-shadow(0 8px 22px rgba(20,60,150,.5));animation:float 3s ease-in-out infinite}
.copy{position:relative;min-width:0}
.title{font-size:25px;font-weight:750;letter-spacing:-.5px}.title b{color:#8fd6ff;font-weight:750}
.sub{margin-top:5px;font-size:10.5px;letter-spacing:.22em;color:#8ba8cc;text-transform:uppercase}
.status{margin-top:18px;display:flex;align-items:center;gap:8px;font-size:12px;color:#a8c1e0}
.dots{display:inline-flex;gap:3px}.dots i{width:4px;height:4px;border-radius:50%;background:#6fc7ff;animation:blink 1.2s infinite}.dots i:nth-child(2){animation-delay:.18s}.dots i:nth-child(3){animation-delay:.36s}
.bar{margin-top:15px;width:278px;height:3px;border-radius:99px;background:rgba(130,180,255,.14);overflow:hidden;position:relative}
.bar:after{content:"";position:absolute;inset:0;width:40%;border-radius:99px;background:linear-gradient(90deg,transparent,#6fc7ff,#b89cff,transparent);animation:slide 1.7s cubic-bezier(.4,0,.2,1) infinite}
.hint{margin-top:10px;font-size:10.5px;color:#5d7899}
@keyframes breathe{0%,100%{transform:scale(.95);opacity:.6}50%{transform:scale(1);opacity:1}}
@keyframes float{0%,100%{transform:translateY(1px)}50%{transform:translateY(-3px)}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(24px,16px)}}
@keyframes slide{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
